[alembic]
# ASCII-only on purpose: Alembic and logging.fileConfig both read this file with the
# process locale encoding, so any CJK byte here breaks "alembic upgrade head" on a
# GBK/Shift-JIS Windows shell. The Chinese rationale (including why no database URL is
# stored here) lives in app/persistence/migrations/env.py, which is always read as UTF-8.
script_location = app/persistence/migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
