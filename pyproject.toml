[build-system]
# setuptools 把 app/ 与 mcp_server/ 打进同一个学习型演示 wheel，因此打包遗漏会在构建期暴露。
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dataops-troubleshooter"
version = "0.1.0"
description = "Evidence-driven troubleshooting agent for synthetic DataOps scenarios."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # 数据库与迁移栈。PostgreSQL 的所有 I/O 只走 asyncpg，不混用同步驱动。
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.116,<1",
  # LangGraph 提供显式的 Planner -> Action -> Observation 状态机，而不是隐式函数链。
  "langgraph>=1.2,<2",
  # 官方 MCP SDK 提供测试真正使用的 stdio 协议边界，因此工具调用不是内部函数调用。
  "mcp>=1.28,<2",
  # 官方 async SDK 提供 OpenAI 兼容的结构化 Chat 边界，Planner 与 Auditor 共用。
  "openai>=2.45,<3",
  "pgvector>=0.4,<1",
  # Pydantic 在数据进入编排代码之前校验每一个外部边界。
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pywin32>=310; sys_platform == 'win32'",
  "sqlalchemy>=2.0,<3",
  # SSE 推流用官方 starlette 扩展而不是手写 text/event-stream：它负责帧编码、心跳 ping 和客户端
  # 断开检测，手写这三件事最容易在演示时表现为"浏览器一直转圈但服务端早已结束"。
  "sse-starlette>=3.4,<4",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
# 开发依赖与运行容器的 lock 隔离，因此镜像里不会出现 pytest 与 ruff。
dev = [
  "httpx>=0.28,<1",
  "pip-tools>=7.5,<8",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["app*", "mcp_server*"]

[tool.pytest.ini_options]
# PostgreSQL 集成测试必须显式选择 marker，因为它们需要真实数据库；默认套件因此在没有基础设施的
# 面试环境里也能完整跑通，不会用 skip 把失败伪装成通过。
addopts = "-ra -m 'not postgres'"
testpaths = ["tests"]
markers = [
  "postgres: requires a running PostgreSQL/pgvector integration database",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
